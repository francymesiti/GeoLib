services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geolib
      POSTGRES_USER: geolib
      POSTGRES_PASSWORD: geolib_demo
    ports: ["5433:5432"]
    volumes:
      - geolib_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  geolib_data:
